[project]
name = "ondetour-eval"
version = "0.1.0"
description = "Regression eval suite for OnDetour AI-trip LLM prompts (rank / order / visit tips)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.23",
  "anthropic>=0.40",
]

[project.scripts]
ondetour-eval = "ondetour_eval.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ondetour_eval"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
